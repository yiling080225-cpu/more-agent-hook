# MCP Server 配置 — 多模态 Agent 联邦 MVP
# 本地版仅包含内置工具，完整版取消注释即可接入外部 MCP Server

servers:
  # ============ 内置工具 (自动加载) ============
  file-tools:
    type: builtin
    capabilities:
      - read_file
      - write_file
      - list_directory

  search-tools:
    type: builtin
    capabilities:
      - web_search
      - text_search

  code-tools:
    type: builtin
    capabilities:
      - validate_python
      - format_code

  # ============ 外部 MCP Server (需要时取消注释) ============
